[package]
name = "vugva"
version = "0.1.0"
edition = "2021"
description = "Virtual Unified GPU VRAM Architecture - software-defined GPU memory virtualization with CPU-bypass hybrid DRAM/VRAM tiering"
license = "AGPL-3.0"
authors = ["Irfan Mahir <irfan@furylogic.com>"]
repository = "https://github.com/Mr-DS-ML-85/VUGVA"
readme = "README.md"
keywords = ["cuda", "gpu", "vram", "memory", "virtualization", "nvrtc", "simd"]
categories = ["api-bindings", "memory-management", "hardware-acceleration"]

[lib]
name = "vugva"
crate-type = ["rlib", "staticlib", "cdylib"]
path = "src/lib.rs"

# Zero external dependencies - pure stdlib Rust
# All CUDA Driver API and NVRTC bindings via raw FFI to libcuda.so / libnvrtc.so

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
