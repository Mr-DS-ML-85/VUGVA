<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
    <linearGradient id="gpu" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#76b900"/>
      <stop offset="100%" style="stop-color:#a8e000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="280" rx="16" fill="url(#bg)"/>

  <g opacity="0.06">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#fff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#fff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="700" y1="0" x2="700" y2="280" stroke="#fff" stroke-width="0.5"/>
    <line x1="800" y1="0" x2="800" y2="280" stroke="#fff" stroke-width="0.5"/>
  </g>

  <g transform="translate(80, 60)" filter="url(#glow)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="url(#gpu)" opacity="0.9"/>
    <rect x="12" y="12" width="56" height="56" rx="4" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
    <rect x="22" y="22" width="36" height="36" rx="2" fill="#fff" opacity="0.15"/>
    <text x="40" y="48" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#000">GPU</text>
    <g fill="#a8e000" opacity="0.7">
      <rect x="10" y="-6" width="4" height="8" rx="1"/>
      <rect x="22" y="-6" width="4" height="8" rx="1"/>
      <rect x="34" y="-6" width="4" height="8" rx="1"/>
      <rect x="46" y="-6" width="4" height="8" rx="1"/>
      <rect x="58" y="-6" width="4" height="8" rx="1"/>
      <rect x="10" y="78" width="4" height="8" rx="1"/>
      <rect x="22" y="78" width="4" height="8" rx="1"/>
      <rect x="34" y="78" width="4" height="8" rx="1"/>
      <rect x="46" y="78" width="4" height="8" rx="1"/>
      <rect x="58" y="78" width="4" height="8" rx="1"/>
    </g>
  </g>

  <text x="200" y="95" font-family="'Courier New', monospace" font-size="52" font-weight="bold" fill="#ffffff" filter="url(#glow)">VUGVA</text>
  <text x="200" y="130" font-family="'Courier New', monospace" font-size="14" fill="#a8e000" letter-spacing="3">VIRTUAL UNIFIED GPU VRAM ARCHITECTURE</text>
  <text x="200" y="168" font-family="system-ui, sans-serif" font-size="14" fill="#ccc">Software-defined GPU memory virtualization with</text>
  <text x="200" y="188" font-family="system-ui, sans-serif" font-size="14" fill="#ccc">CPU-bypass hybrid DRAM/VRAM tiering</text>

  <g transform="translate(200, 210)">
    <rect x="0" y="0" width="90" height="26" rx="13" fill="#76b900" opacity="0.9"/>
    <text x="45" y="17" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#000">Rust</text>
    <rect x="100" y="0" width="110" height="26" rx="13" fill="#00b4d8" opacity="0.9"/>
    <text x="155" y="17" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#000">Zero Deps</text>
    <rect x="220" y="0" width="110" height="26" rx="13" fill="#e76f51" opacity="0.9"/>
    <text x="275" y="17" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#000">AGPL-3.0</text>
    <rect x="340" y="0" width="140" height="26" rx="13" fill="#9b5de5" opacity="0.9"/>
    <text x="410" y="17" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fff">sm_60 — sm_120</text>
    <rect x="490" y="0" width="130" height="26" rx="13" fill="#f72585" opacity="0.9"/>
    <text x="555" y="17" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#fff">CUDA 10–13</text>
  </g>

  <text x="860" y="265" text-anchor="end" font-family="monospace" font-size="11" fill="#666">v0.1.0</text>
</svg>
